<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Reset StarShark password</title>

  <link rel="stylesheet" href="../styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
</head>

<body class="auth-page">

<div class="auth-card">

  <div class="brand">
    <img src="../assets/logo.png">
  </div>

  <h1>Choose a new password</h1>

  <form id="resetForm">

    <div class="field">

      <label>New password</label>

      <input
        id="password"
        class="input"
        type="password"
        minlength="8"
        required
        placeholder="At least 8 characters"
      >

    </div>

    <button
      class="btn"
      type="submit"
    >
      Update password
    </button>

  </form>

  <div
    id="status"
    class="notice"
    style="display:none;margin-top:14px"
  ></div>

</div>


<script>

const statusBox =
  document.getElementById("status");


document
  .getElementById("resetForm")
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      try {

        const supabase =
          await StarSharkAuth
            .getClient();


        const {
          error
        } =
          await supabase.auth
            .updateUser({

              password:
                document
                  .getElementById(
                    "password"
                  )
                  .value

            });


        if (error) {
          throw error;
        }


        statusBox.style.display =
          "block";


        statusBox.textContent =
          "Password updated. Redirecting to your dashboard…";


        setTimeout(
          () => {

            location.replace(
              "../app/dashboard.html"
            );

          },
          900
        );

      }

      catch (error) {

        statusBox.style.display =
          "block";


        statusBox.textContent =
          error.message ||
          "Could not update password.";

      }

    }
  );

</script>

</body>
</html>
