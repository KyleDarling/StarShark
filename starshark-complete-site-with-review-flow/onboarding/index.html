<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>StarShark Onboarding</title>

  <link rel="stylesheet" href="../styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth/auth.js"></script>
</head>

<body class="onboard">

<div class="onboard-inner">

  <div class="brand">
    <img src="../assets/logo.png">
  </div>

  <div class="progress">
    <i class="done"></i>
    <i class="done"></i>
    <i></i>
    <i></i>
  </div>

  <div class="step-card">

    <h1>Create your StarShark workspace</h1>

    <p class="muted">
      Your workspace keeps each business and its data separated.
    </p>

    <form id="workspaceForm">

      <div class="grid2">

        <div class="field">
          <label>Business name</label>

          <input
            id="businessName"
            class="input"
            required
            placeholder="Darling Window Cleaning"
          >
        </div>

        <div class="field">
          <label>Business email</label>

          <input
            id="businessEmail"
            class="input"
            type="email"
            placeholder="office@business.com"
          >
        </div>

      </div>

      <div class="grid2">

        <div class="field">
          <label>Business phone</label>

          <input
            id="businessPhone"
            class="input"
            placeholder="(714) 555-0123"
          >
        </div>

        <div class="field">
          <label>Timezone</label>

          <select id="timezone">

            <option>
              America/Los_Angeles
            </option>

            <option>
              America/Denver
            </option>

            <option>
              America/Chicago
            </option>

            <option>
              America/New_York
            </option>

          </select>

        </div>

      </div>

      <button
        id="continueBtn"
        class="btn"
        type="submit"
      >
        Create workspace →
      </button>

    </form>

    <div
      id="status"
      class="notice"
      style="display:none;margin-top:14px"
    ></div>

  </div>

</div>


<script>

let supabase;
let currentSession;


(async () => {

  try {

    supabase =
      await StarSharkAuth
        .getClient();


    currentSession =
      await StarSharkAuth
        .requireSession();


    if (!currentSession) {
      return;
    }


    const metadata =
      currentSession.user
        .user_metadata || {};


    if (
      metadata.business_name
    ) {

      document
        .getElementById(
          "businessName"
        )
        .value =
          metadata.business_name;

    }


    const {
      data,
      error
    } =
      await supabase
        .from(
          "business_members"
        )
        .select(
          "business_id"
        )
        .eq(
          "user_id",
          currentSession.user.id
        )
        .limit(1);


    if (error) {
      throw error;
    }


    if (
      data &&
      data.length
    ) {

      location.replace(
        "../app/dashboard.html"
      );

    }

  }

  catch (error) {

    const statusBox =
      document.getElementById(
        "status"
      );


    statusBox.style.display =
      "block";


    statusBox.textContent =
      error.message ||
      "Could not load onboarding.";

  }

})();


document
  .getElementById(
    "workspaceForm"
  )
  .addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const continueBtn =
        document.getElementById(
          "continueBtn"
        );


      const statusBox =
        document.getElementById(
          "status"
        );


      continueBtn.disabled =
        true;


      continueBtn.textContent =
        "Creating workspace…";


      statusBox.style.display =
        "none";


      try {

        const {
          error
        } =
          await supabase.rpc(
            "create_business_for_current_user",
            {

              p_name:
                document
                  .getElementById(
                    "businessName"
                  )
                  .value
                  .trim(),

              p_email:
                document
                  .getElementById(
                    "businessEmail"
                  )
                  .value
                  .trim() ||
                null,

              p_phone:
                document
                  .getElementById(
                    "businessPhone"
                  )
                  .value
                  .trim() ||
                null,

              p_timezone:
                document
                  .getElementById(
                    "timezone"
                  )
                  .value

            }
          );


        if (error) {
          throw error;
        }


        location.replace(
          "../app/dashboard.html"
        );

      }

      catch (error) {

        statusBox.style.display =
          "block";


        statusBox.textContent =
          error.message ||
          "Could not create workspace.";

      }

      finally {

        continueBtn.disabled =
          false;


        continueBtn.textContent =
          "Create workspace →";

      }

    }
  );

</script>

</body>
</html>
